# path                            policy        arg    auto
# policy: purge | age <Nd> | keep-newest <N> | pw-orphan | vacuum <size>
# auto:   yes = runs on plain `maint clean`; no = needs an explicit flag

~/.npm/_npx                       age           30d    yes
~/.cache/ms-playwright            pw-orphan     -      no
~/.cache/ms-playwright-mcp        keep-newest   1      no
~/.cache/puppeteer                purge         -      no
~/.cache/huggingface              age           60d    no
~/.EasyOCR                        age           60d    no
~/.cache/wayback-video            age           14d    no
~/.local/share/claude/versions    keep-newest   1      no
~/.cache/pip                      purge         -      yes
/var/log/journal                  vacuum        100M   yes
